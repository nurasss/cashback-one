upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# Determine if the request Accept header indicates a browser HTML page navigation
map $http_accept $is_html_request {
    default 0;
    ~*text/html 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1M;

    # Bounded timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Production security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # Request ID forwarding: reuse incoming X-Request-ID or generate Nginx $request_id
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    # Proxy headers configuration
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;

    # Static assets cache control
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Backend API: Health probes (fail-closed, JSON)
    location ~ ^/health(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Agent sync
    location ~ ^/agent(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Customer auth
    location ~ ^/auth(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Customer wallet
    location ~ ^/me(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Webhooks
    location ~ ^/webhooks(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Generic /api prefix
    location ~ ^/api(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Admin routes:
    # If browser navigates directly or refreshes on /admin/* (Accept: text/html), serve React SPA index.html.
    # Otherwise (API client, fetch, non-HTML requests, mutations), proxy to backend API.
    location /admin {
        if ($is_html_request = 1) {
            rewrite ^ /index.html break;
        }
        proxy_pass http://backend_upstream;
    }

    # Frontend SPA catch-all fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
