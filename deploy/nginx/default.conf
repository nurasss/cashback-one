upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# Map forwarded proto to prevent Nginx internal HTTP listener from rewriting https to http
map $http_x_forwarded_proto $pass_proto {
    default $scheme;
    https https;
}

# Determine if the request indicates a browser HTML page navigation vs an API/data call
map "$http_accept:$http_x_admin_request" $is_spa_page_request {
    default 0;
    "~*text/html:0" 1;
    "~*text/html:" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1M;

    # Bounded timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Production security headers
    include /etc/nginx/conf.d/security_headers.conf;

    # Request ID forwarding: reuse incoming X-Request-ID or generate Nginx $request_id
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    # Proxy headers configuration
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $pass_proto;
    proxy_set_header X-Request-ID $req_id;

    # Static assets cache control with security headers preserved
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/conf.d/security_headers.conf;
        try_files $uri =404;
    }

    # Backend API: Health probes (fail-closed, JSON)
    location ~ ^/health(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Agent sync
    location ~ ^/agent(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Customer auth
    location ~ ^/auth(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Customer wallet
    location ~ ^/me(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Webhooks
    location ~ ^/webhooks(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Backend API: Generic /api prefix
    location ~ ^/api(/|$) {
        proxy_pass http://backend_upstream;
    }

    # Admin routes:
    # If browser navigates directly or refreshes on /admin/* (Accept: text/html and not X-Admin-Request),
    # serve React SPA index.html via internal rewrite (last).
    # Otherwise (API client, fetch, non-HTML requests, mutations), proxy to backend API.
    location /admin {
        if ($is_spa_page_request = 1) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend_upstream;
    }

    # Frontend SPA catch-all fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
