services:
  postgres:
    image: postgres:16-alpine
    container_name: loyalty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poscenter_loyalty_smoke}
      POSTGRES_USER: ${POSTGRES_USER:-poscenter_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poscenter_app} -d ${POSTGRES_DB:-poscenter_loyalty_smoke}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - loyalty_net

  redis:
    image: redis:7-alpine
    container_name: loyalty_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - loyalty_net

  migration:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: loyalty_migration
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      APP_NAME: "POSCENTER Loyalty Migration"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be provided}
      ADMIN_JWT_SIGNING_KEY: ${ADMIN_JWT_SIGNING_KEY:?ADMIN_JWT_SIGNING_KEY must be provided}
      AUTH_CHALLENGE_HASH_KEY: ${AUTH_CHALLENGE_HASH_KEY:?AUTH_CHALLENGE_HASH_KEY must be provided}
      SMS_OTP_HASH_KEY: ${SMS_OTP_HASH_KEY:?SMS_OTP_HASH_KEY must be provided}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-["https://admin.loyalty.local","https://loyalty.local"]}
      ADMIN_ALLOW_INSECURE_HTTP: "false"
      SMS_PROVIDER_MODE: "disabled"
      WHATSAPP_LOGIN_NUMBER: ${WHATSAPP_LOGIN_NUMBER:-+77001234567}
      WAPPI_LOGIN_PROFILE_ID: ${WAPPI_LOGIN_PROFILE_ID:-smoke-profile-123}
      WAPPI_WEBHOOK_AUTH_HEADER: ${WAPPI_WEBHOOK_AUTH_HEADER:-X-Wappi-Webhook-Signature}
      WAPPI_WEBHOOK_AUTH_SECRET: ${WAPPI_WEBHOOK_AUTH_SECRET:?WAPPI_WEBHOOK_AUTH_SECRET must be provided}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - loyalty_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: loyalty_backend
    restart: unless-stopped
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips \"$$FORWARDED_ALLOW_IPS\""]
    environment:
      APP_ENV: production
      DEBUG: "false"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be provided}
      ADMIN_JWT_SIGNING_KEY: ${ADMIN_JWT_SIGNING_KEY:?ADMIN_JWT_SIGNING_KEY must be provided}
      AUTH_CHALLENGE_HASH_KEY: ${AUTH_CHALLENGE_HASH_KEY:?AUTH_CHALLENGE_HASH_KEY must be provided}
      SMS_OTP_HASH_KEY: ${SMS_OTP_HASH_KEY:?SMS_OTP_HASH_KEY must be provided}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-["https://admin.loyalty.local","https://loyalty.local"]}
      ADMIN_ALLOW_INSECURE_HTTP: "false"
      SMS_PROVIDER_MODE: "disabled"
      WHATSAPP_LOGIN_NUMBER: ${WHATSAPP_LOGIN_NUMBER:-+77001234567}
      WAPPI_LOGIN_PROFILE_ID: ${WAPPI_LOGIN_PROFILE_ID:-smoke-profile-123}
      WAPPI_WEBHOOK_AUTH_HEADER: ${WAPPI_WEBHOOK_AUTH_HEADER:-X-Wappi-Webhook-Signature}
      WAPPI_WEBHOOK_AUTH_SECRET: ${WAPPI_WEBHOOK_AUTH_SECRET:?WAPPI_WEBHOOK_AUTH_SECRET must be provided}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
      UVICORN_FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT_SECONDS: "10"
      DB_POOL_RECYCLE_SECONDS: "1800"
      DB_POOL_PRE_PING: "true"
      DB_STATEMENT_TIMEOUT_MS: "15000"
      REDIS_CONNECT_TIMEOUT_SECONDS: "3"
      REDIS_SOCKET_TIMEOUT_SECONDS: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - loyalty_net

  proxy:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://loyalty.local}
        VITE_ALLOW_INSECURE_HTTP: "0"
    container_name: loyalty_proxy
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/conf.d/security_headers.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      loyalty_net:
        ipv4_address: 172.28.0.10

volumes:
  postgres_data:
  redis_data:

networks:
  loyalty_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
