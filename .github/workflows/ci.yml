name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: poscenter_loyalty_test
          POSTGRES_USER: loyalty
          POSTGRES_PASSWORD: fixture-ci-postgres-password-12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint & Format Check
        working-directory: backend
        run: ruff check .

      - name: Mypy Strict Type Check
        working-directory: backend
        run: mypy app

      - name: Compileall Bytecode Check
        working-directory: backend
        run: python -m compileall app migrations tests

      - name: Run Pytest Suite
        working-directory: backend
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://loyalty:fixture-ci-postgres-password-12345@127.0.0.1:5432/poscenter_loyalty_test
          REDIS_URL: redis://127.0.0.1:6379/15
          APP_ENV: test
        run: pytest -v

  admin-checks:
    name: Admin SPA Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Run Tests
        working-directory: admin
        run: npm test

      - name: Build SPA
        working-directory: admin
        env:
          VITE_API_BASE_URL: https://loyalty.local
          VITE_ALLOW_INSECURE_HTTP: "0"
        run: npm run build

      - name: Security Audit
        working-directory: admin
        run: npm audit --audit-level=high

  mobile-checks:
    name: Mobile App Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: Run Tests
        working-directory: mobile
        run: npm test

  agent-checks:
    name: Agent Service Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements.txt pytest ruff mypy

      - name: Ruff Lint Check
        working-directory: agent
        run: ruff check .

      - name: Mypy Strict Type Check
        working-directory: agent
        run: mypy src

      - name: Compileall Bytecode Check
        working-directory: agent
        run: python -m compileall src tests

      - name: Run Agent Tests
        working-directory: agent
        run: pytest -v

  docker-verification:
    name: Docker Builds & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: poscenter-backend:smoke-test

      - name: Build Admin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: false
          tags: poscenter-admin:smoke-test

      - name: Validate Compose File Syntax
        run: |
          docker compose -f deploy/compose.prod-smoke.yml config --quiet

  pre-one-e2e:
    name: Pre-ONE End-to-End Integration Harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashback_e2e_ci
          POSTGRES_USER: loyalty
          POSTGRES_PASSWORD: fixture-ci-postgres-password-12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          pip install -e "./agent"

      - name: Run Pre-ONE E2E Suite
        env:
          POSTGRES_E2E_URL: postgresql+asyncpg://loyalty:fixture-ci-postgres-password-12345@127.0.0.1:5432/cashback_e2e_ci
          REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          chmod +x scripts/run_pre_one_e2e.sh
          ./scripts/run_pre_one_e2e.sh

