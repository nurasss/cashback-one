[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poscenter-loyalty-backend"
version = "0.1.0"
description = "POSCENTER Loyalty Cloud API & Data Layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "Pillow==13.0.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.0",
    "ruff>=0.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
